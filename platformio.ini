; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Board envs: go (HW_ID=1), mini (HW_ID=2), minig (HW_ID=3); the firmware runs on FreeRTOS
;   pio run -e minig            build one board
;   pio run -e go -e mini -e minig   build all boards
;   pio test -e native          run host unit tests (lib/KarabasCommon)

[platformio]
default_envs = minig

[rp2040]
; pinned: the platform pins arduino-pico (5.5.1), which patches/ and the PIO / FreeRTOS
; workarounds are written against. Bump it deliberately and re-check the patches.
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#f2877dd7844f8891231ad9fa69fd99921fe60466
board = pico
framework = arduino
upload_port = /dev/ttyACM0
board_build.core = earlephilhower
board_build.f_cpu = 120000000L
board_build.arduino.earlephilhower.usb_manufacturer = Karabas
board_build.arduino.earlephilhower.usb_product = Go
board_name = "Karabas Go"
lib_extra_dirs = ../lib/
; FreeRTOS: app and usb host run as pinned tasks (see CLAUDE.md).
; DIAG_STATS prints loop rates, worst loop gaps and stack headroom every 10 s (debug=1).
; configTIMER_TASK_PRIORITY / configTIMER_QUEUE_LENGTH: pico-sdk locks released from an irq
; (queues, mutexes, e.g. TinyUSB's usb irq, the ps/2 repeat alarm) wake their waiters through
; xEventGroupSetBitsFromISR, which is deferred to the FreeRTOS timer task. APP and USB never
; block, so at the default priority 2 that task never runs and those wakeups are lost.
build_flags = 
	-D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS
	-D DIAG_STATS=1
	-D configTIMER_TASK_PRIORITY=7
	-D configTIMER_QUEUE_LENGTH=32
	; panics are kept for the next boot's log (src/diag/hang_diag, debug=1)
	-Wl,--wrap=panic
	-D USE_TINYUSB
	-D CFG_TUH_XINPUT=1 ; one XInput interface per USB device
	; USB host limits (patches/5): 3 hubs (the Mini G one, an external one, a keyboard's:
	; the wired Apple keyboards have a hub inside),
	; 8 devices, 16 HID interfaces. Pico-PIO-USB has 32 endpoints in all (PIO_USB_EP_POOL_CNT,
	; a 32-bit mask): a device takes one for control plus one per interrupt / bulk endpoint.
	-D CFG_TUH_HUB=3
	-D CFG_TUH_DEVICE_MAX=8
	-D CFG_TUH_HID=16
	; the full config descriptor and each HID report descriptor are read into this buffer:
	; a longer config descriptor fails the device, a longer report descriptor is skipped
	-D CFG_TUH_ENUMERATION_BUFSIZE=1024
	-D SPI_DRIVER_SELECT=1
	; SdFs / FsFile: FAT16, FAT32 and exFAT cards
	-D SDFAT_FILE_TYPE=3
	-D SD_FAT_TYPE=3
	; SdFat block transfers through transfer(nullptr, buf, n) / transfer(buf, nullptr, n), which
	; PioSPI runs as pipelined PIO transfers. The Adafruit fork's default (1) makes PioSPI move
	; every SD byte with a separate transfer(uint8_t) call.
	-D USE_SPI_ARRAY_TRANSFER=2
#	-D WAIT_SERIAL=1
	-D PREFER_SDFAT_LIBRARY
	-D DISABLE_FS_H_WARNING
	-I include/
extra_scripts = pre:apply_patches.py ; patch for Adafruit TinyUSB Library >= 2.0.1
test_ignore = *
lib_deps = 
	; TinyUSB in arduino-pico 5.5.1 uses bool class-driver open(); newer XInput commits use uint16_t.
	https://github.com/Ryzee119/tusb_xinput#cfd83ba9b0809cf69f7b63d351f44ff73ebd0e30
	sparkfun/SparkFun PCA9536 Arduino Library@1.2.2
	sparkfun/SparkFun External EEPROM Arduino Library@3.2.12
	adafruit/RTClib@2.1.4
	adafruit/SdFat - Adafruit Fork@2.3.103
	adafruit/Adafruit LED Backpack Library@1.5.1
	adafruit/Adafruit ssd1306@2.5.17
	GyverLibs/GyverMenu@1.0.1
	GyverLibs/StringN@1.0.6
lib_ignore = SdFat ; ignore platform's SdFat library

[env:native]
platform = native
test_framework = unity
build_flags = -std=c11 -Wall -Wextra
lib_ldf_mode = chain+
lib_deps = KarabasCommon

[env:go]
extends = rp2040
build_flags = ${rp2040.build_flags} -D HW_ID=1

[env:mini]
extends = rp2040
build_flags = ${rp2040.build_flags} -D HW_ID=2

[env:minig]
extends = rp2040
build_flags = ${rp2040.build_flags} -D HW_ID=3
