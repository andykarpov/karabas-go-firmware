; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Board envs: go (HW_ID=1), mini (HW_ID=2), minig (HW_ID=3)
;   pio run -e minig            build one board
;   pio run -e go -e mini -e minig   build all boards
;   pio test -e native          run host unit tests (lib/KarabasCommon)

[platformio]
default_envs = minig

[rp2040]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
upload_port = /dev/ttyUSBPico
board_build.core = earlephilhower
board_build.f_cpu = 120000000L
board_build.arduino.earlephilhower.usb_manufacturer = Karabas
board_build.arduino.earlephilhower.usb_product = Go
board_name = "Karabas Go"
lib_extra_dirs = ../lib/
build_flags = 
	-D USE_TINYUSB
	-D SPI_DRIVER_SELECT=1
	-D SDFAT_FILE_TYPE=1
	-D SD_FAT_TYPE=1
#	-D WAIT_SERIAL=1
	-D PREFER_SDFAT_LIBRARY
	-D DISABLE_FS_H_WARNING
	-I include/
extra_scripts = pre:apply_patches.py ; patch for Adafruit TinyUSB Library >= 2.0.1
test_ignore = *
lib_deps = 
	sparkfun/SparkFun PCA9536 Arduino Library@1.2.2
	sparkfun/SparkFun External EEPROM Arduino Library@3.2.12
	adafruit/RTClib@2.1.4
	adafruit/SdFat - Adafruit Fork@2.3.103
	adafruit/Adafruit LED Backpack Library@1.5.1
	adafruit/Adafruit ssd1306@2.5.17
	GyverLibs/GyverMenu@1.0.1
	GyverLibs/GyverFIFO@1.2.0
	GyverLibs/StringN@1.0.6
lib_ignore = SdFat ; ignore platform's SdFat library

[env:go]
extends = rp2040
build_flags = ${rp2040.build_flags} -D HW_ID=1

[env:mini]
extends = rp2040
build_flags = ${rp2040.build_flags} -D HW_ID=2

[env:minig]
extends = rp2040
build_flags = ${rp2040.build_flags} -D HW_ID=3

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
lib_ldf_mode = chain+
lib_deps = KarabasCommon

; FreeRTOS prototype builds (phase 4): same firmware, app and usb host run as pinned tasks.
; DIAG_STATS prints loop rates, worst loop gaps and stack headroom every 10 s (debug=1).
[rtos]
build_flags = -D PIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS -D DIAG_STATS=1

[env:go_rtos]
extends = env:go
build_flags = ${env:go.build_flags} ${rtos.build_flags}

[env:mini_rtos]
extends = env:mini
build_flags = ${env:mini.build_flags} ${rtos.build_flags}

[env:minig_rtos]
extends = env:minig
build_flags = ${env:minig.build_flags} ${rtos.build_flags}

; Step-by-step boot report over USB serial for debugging the RTOS build
[env:minig_rtos_probe]
extends = env:minig_rtos
build_flags = ${env:minig_rtos.build_flags} -D RTOS_PROBE=1 -D PIO_USB_PROBE_COUNTERS

; same, but only the usb host task is started (core0 keeps reporting if core1 hangs)
[env:minig_rtos_probe2]
extends = env:minig_rtos
build_flags = ${env:minig_rtos.build_flags} -D RTOS_PROBE=2 -D PIO_USB_PROBE_COUNTERS
